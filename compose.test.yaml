name: fullstack-lab-auth-test

# 認証 API 単体の結合テスト（Karate）用。依存する Keycloak を本物で立て、realm は keycloak/import から取り込む。
# 値はテスト専用の使い捨て。実行: docker compose -f compose.test.yaml build && docker compose -f compose.test.yaml run --rm karate

services:
  karate:
    build: ./karate
    environment:
      BASE_URL: http://auth:8080
      KEYCLOAK_URL: http://keycloak:8080
      AUTH_API_CLIENT_ID: auth-api
      AUTH_API_CLIENT_SECRET: test-auth-api-secret
    volumes:
      - ./karate:/karate:ro
    depends_on:
      auth:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  auth:
    build: .
    environment:
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_REALM: customer
      AUTH_API_CLIENT_ID: auth-api
      AUTH_API_CLIENT_SECRET: test-auth-api-secret
    # Keycloak の起動は待たない（トークンは最初の呼び出し時に取得する）
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
      # realm JSON 内の ${...} に埋め込まれる値
      CUSTOMER_APP_URL: http://localhost:8080
      CUSTOMER_CLIENT_SECRET: test-customer-secret
      AUTH_API_CLIENT_SECRET: test-auth-api-secret
      LOCAL_TEST_USER_PASSWORD: password
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
    healthcheck:
      # イメージに curl / wget が無いため、bash の /dev/tcp で管理ポートのヘルスエンドポイントを叩く
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
