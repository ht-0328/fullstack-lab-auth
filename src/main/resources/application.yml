spring:
  application:
    name: auth
  mvc:
    # 入力エラーなども RFC 9457 (Problem Details) 形式で返す（API / BFF / 認可 API と同じ）
    problemdetails:
      enabled: true

server:
  port: 8080

auth:
  keycloak:
    # コンテナ間の URL（ブラウザから見た URL とは異なる）。トークンは最初の呼び出し時に取得する
    base-url: ${KEYCLOAK_BASE_URL}
    realm: ${KEYCLOAK_REALM:customer}
    # サービスアカウント付きの機密クライアント（realm-management の manage-users / view-users）
    client-id: ${AUTH_API_CLIENT_ID:auth-api}
    client-secret: ${AUTH_API_CLIENT_SECRET}
    # 登録したユーザーに付与する realm ロール
    customer-role: customer

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [requestId=%X{requestId:-}]"
